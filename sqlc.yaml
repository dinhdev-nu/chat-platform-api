version: "2"
sql:
  - engine: "mysql"
    queries: "./internal/infrastructure/mysql/query"
    schema:  
      - "./internal/infrastructure/mysql/migrations"
      - "./internal/infrastructure/mysql/schema"
    gen:
      go:
        package:                      "sqlc"
        out:                          "./internal/infrastructure/mysql/sqlc"
        emit_json_tags:               false  # dùng DTO riêng, tránh leak DB layer
        emit_interface:               true   # mock trong unit test
        emit_exact_table_names:       false  # Message thay vì Messages
        emit_empty_slices:            true   # JSON [] thay vì null
        emit_pointers_for_null_types: true   # *time.Time, *string thay vì sql.NullXXX
        overrides:
          - db_type: "datetime"
            nullable: true
            go_type:
              import:  "time"
              type:    "Time"
              pointer: true
          - db_type: "binary(16)" # or "bytea", etc.
            go_type: 
              type: "byte"
              slice: true
            